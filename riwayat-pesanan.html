<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riwayat Pesanan Saya - NADYA Catering Pineleng</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/font-awesome.min.css">
  <link rel="stylesheet" href="css/custom-ui.css">
</head>

<body>

  <!-- NAVBAR TANPA IKON -->
  <nav class="navbar custom-navbar navbar-fixed-top">
    <div class="container">
      <div class="navbar-header">
        <a href="index.html" class="navbar-brand">
          <img src="images/nadyalogo.png" alt="Logo" class="nav-logo">
        </a>
      </div>
      <div class="collapse navbar-collapse">
        <ul class="nav navbar-nav navbar-right">
          <li><a href="index.html#menu" class="btn-custom btn-custom-sm btn-custom-outline">Pesan Menu Lagi</a></li>
          <li><a href="profil.html" class="btn-custom btn-custom-sm btn-custom-outline">Profil Saya</a></li>
          <li><a href="index.html" class="btn-custom btn-custom-sm btn-custom-outline">Beranda</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="history-page" style="padding: 40px 0 80px;">
    <div class="container">
      <div style="margin-bottom:24px;">
        <h2 style="font-size:24px; font-weight:800; margin-bottom:4px;"><i class="fa fa-history"
            style="color:#ff5200;"></i> Riwayat Pesanan Saya</h2>
        <p style="color:#64748b; font-size:14px; margin:0;">Daftar transaksi katering yang pernah Anda pesan</p>
      </div>

      <div id="historyOrdersContainer">
        <div class="text-center p-5 text-muted">
          <i class="fa fa-spinner fa-spin fa-2x"></i>
          <p class="mt-2">Memuat riwayat transaksi Anda...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/jquery.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="js/firebase-init.js"></script>

  <script>
    function formatRupiah(num) {
      return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", minimumFractionDigits: 0 }).format(num || 0);
    }

    document.addEventListener("DOMContentLoaded", () => {
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          alert("Silakan login untuk melihat riwayat pesanan.");
          window.location.href = "index.html";
          return;
        }

        const container = document.getElementById("historyOrdersContainer");

        db.collection("orders")
          .where("userId", "==", user.uid)
          .onSnapshot((snapshot) => {
            if (snapshot.empty) {
              container.innerHTML = `
                <div class="history-card text-center p-5">
                  <i class="fa fa-shopping-basket fa-3x text-muted"></i>
                  <p class="mt-3 font-weight-bold">Anda belum pernah membuat pesanan katering.</p>
                  <a href="index.html#menu" class="btn-custom btn-custom-primary mt-2">Pilih Menu Catering Sekarang</a>
                </div>
              `;
              return;
            }

            const orders = [];
            snapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));

            orders.sort((a, b) => {
              const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
              const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
              return timeB - timeA;
            });

            container.innerHTML = orders.map(o => {
              const total = formatRupiah(o.totalHarga || o.totalBiaya || 0);
              const status = o.status || 'Pending';
              const pay = o.paymentStatus || 'Unpaid';

              let payBadge = ['paid', 'lunas'].includes(pay.toLowerCase())
                ? '<span class="badge badge-success" style="padding:5px 10px; font-size:11px;">Lunas</span>'
                : '<span class="badge badge-warning" style="padding:5px 10px; font-size:11px;">Belum Lunas</span>';

              const btnText = o.buktiPembayaranUrl ? 'Lihat Bukti & Detail' : 'Upload Bukti Bayar';

              return `
                <div class="history-card">
                  <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid #f1f5f9;">
                    <div>
                      <strong style="color:#ff5200; font-size:14px;">#${o.id.substring(0, 8)}</strong>
                      <span style="color:#64748b; margin-left:10px; font-size:12.5px;"><i class="fa fa-calendar"></i> ${o.tanggalAcara || '-'}</span>
                    </div>
                    <div>
                      ${payBadge}
                      <span class="badge badge-info" style="padding:5px 10px; font-size:11px;">${status}</span>
                    </div>
                  </div>

                  <div class="row align-items-center">
                    <div class="col-md-7 col-sm-12">
                      <h4 style="font-size:16px; margin-bottom:6px;">${o.namaKegiatan || 'Acara Catering'}</h4>
                      <p style="margin-bottom:4px; font-size:13px;"><i class="fa fa-cutlery" style="color:#ff5200;"></i> ${o.namaPaket || 'Paket Catering'}</p>
                      <p style="margin-bottom:0; font-size:12.5px; color:#64748b;"><i class="fa fa-map-marker" style="color:#ff5200;"></i> Lokasi: ${o.lokasiAcara || '-'}</p>
                    </div>
                    <div class="col-md-5 col-sm-12 text-right" style="margin-top:10px;">
                      <span style="font-size:12px; color:#64748b; display:block;">Total Biaya:</span>
                      <strong style="color:#ff5200; font-size:18px; display:block; margin-bottom:12px;">${total}</strong>
                      
                      <a href="order-success.html?orderId=${o.id}" class="btn-custom btn-custom-sm btn-custom-outline">
                        <i class="fa fa-file-text-o"></i> ${btnText}
                      </a>
                    </div>
                  </div>
                </div>
              `;
            }).join("");
          });
      });
    });
  </script>
</body>

</html>
